openapi: 3.0.3
info:
  title: Color Matching API
  version: v1
  description: |
    Vendored OpenAPI contract for the iOS companion app.

    Provenance: generated by OpenApiSpex in viamin/color_matching
    (ColorMatchingWeb.ApiSpec) and published at `GET /api/v1/openapi.json`
    (viamin/color_matching#110). Reconstructed at commit `main` as of
    2026-11-02 from `lib/color_matching_web/api_spec.ex`,
    `lib/color_matching_web/api_schemas.ex`, and the controller operation
    specs.

    Deviations from the published document are marked inline with
    `[vendored ...]` notes and enumerated in
    docs/color-matching-openapi-deltas.md:

    * `TestSheetManifest` and `RankedResults` are gap-filled with the fields
      the server actually renders (see ColorMatchingWeb.TestSheetJSON) but
      the published spec does not yet validate.
    * Composition keywords that only express server-side validation intent
      (`anyOf` branches made only of `required` lists) are dropped.
    * `RgbPayload` and `PairScoreRequest` are pinned to the single wire
      shape the app emits.
    * Inline object schemas the app constructs directly are promoted to
      named components (RecentSheet, PairJudgment, MeasurementUploadItem,
      CaptureQualityPayload).
servers:
  - url: /
tags:
  - name: Test sheets
  - name: Captures
  - name: Palettes
  - name: Illuminant measurements
  - name: Image mapping
security:
  - bearerAuth: []
paths:
  /api/v1/printer_profiles:
    get:
      operationId: ColorMatchingWeb.ColorPaletteController.printer_profiles
      tags: [Palettes]
      summary: List printer profiles
      responses:
        "200":
          description: Printer profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterProfilesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/printer_profiles/{printer_profile_id}/colors:
    get:
      operationId: ColorMatchingWeb.ColorPaletteController.profile_colors
      tags: [Palettes]
      summary: List profile colors
      parameters:
        - name: printer_profile_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Profile colors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileColorsResponse"
        "400":
          description: Invalid printer profile ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Printer profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Invalid printer profile ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/printer_profiles/{printer_profile_id}/metamer_pairs:
    get:
      operationId: ColorMatchingWeb.ColorPaletteController.metamer_pairs
      tags: [Palettes]
      summary: List confirmed metamer pairs
      parameters:
        - name: printer_profile_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Metamer pairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetamerPairsResponse"
        "400":
          description: Invalid printer profile ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Printer profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Invalid printer profile ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/palettes:
    get:
      operationId: ColorMatchingWeb.ColorPaletteController.palettes
      tags: [Palettes]
      summary: List palettes
      responses:
        "200":
          description: Palettes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PalettesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/colors:
    get:
      operationId: ColorMatchingWeb.ColorPaletteController.colors
      tags: [Palettes]
      summary: List palette colors and illuminant responses
      parameters:
        - name: printer_profile_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: palette_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Colors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColorsResponse"
        "400":
          description: Invalid printer profile ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/test_sheets/recent:
    get:
      operationId: ColorMatchingWeb.TestSheetController.recent
      tags: [Test sheets]
      summary: List recent test sheets
      responses:
        "200":
          description: Recent sheets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentSheetsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/test_sheets/{sheet_id}/manifest:
    get:
      operationId: ColorMatchingWeb.TestSheetController.manifest
      tags: [Test sheets]
      summary: Fetch a test sheet manifest
      parameters:
        - name: sheet_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sheet manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSheetManifest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Test sheet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/test_sheets/{sheet_id}/ranked_results:
    get:
      operationId: ColorMatchingWeb.TestSheetController.ranked_results
      tags: [Test sheets]
      summary: Fetch ranked results for a test sheet
      parameters:
        - name: sheet_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankedResults"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Test sheet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/test_sheets/{sheet_id}/captures:
    post:
      operationId: ColorMatchingWeb.CaptureController.create
      tags: [Captures]
      summary: Create a capture for a test sheet
      parameters:
        - name: sheet_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureRequest"
      responses:
        "201":
          description: Capture created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureCreatedResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Test sheet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Invalid capture attributes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/captures/{capture_id}/measurements:
    post:
      operationId: ColorMatchingWeb.CaptureController.upload_measurements
      tags: [Captures]
      summary: Upload capture measurements
      parameters:
        - name: capture_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementUploadRequest"
      responses:
        "200":
          description: Measurements accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementUploadResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Capture not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Invalid measurement upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/captures/{capture_id}/judgments:
    post:
      operationId: ColorMatchingWeb.CaptureController.upload_judgments
      tags: [Captures]
      summary: Upload capture judgments
      parameters:
        - name: capture_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgmentUploadRequest"
      responses:
        "200":
          description: Judgments accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgmentUploadResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Capture not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Invalid judgment upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/illuminant_measurements:
    post:
      operationId: ColorMatchingWeb.IlluminantMeasurementController.create
      tags: [Illuminant measurements]
      summary: Create an illuminant measurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IlluminantMeasurementRequest"
      responses:
        "201":
          description: Measurement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IlluminantMeasurementResponse"
        "422":
          description: Invalid measurement attributes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/illuminant_measurements/bulk:
    post:
      operationId: ColorMatchingWeb.IlluminantMeasurementController.bulk_create
      tags: [Illuminant measurements]
      summary: Create illuminant measurements in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIlluminantMeasurementRequest"
      responses:
        "201":
          description: Measurements created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIlluminantMeasurementResponse"
        "422":
          description: Invalid measurement attributes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/multi_image_mapping:
    post:
      operationId: ColorMatchingWeb.MultiImageMappingController.create
      tags: [Image mapping]
      summary: Map grayscale images to a palette-colored PNG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiImageMappingRequest"
      responses:
        "200":
          description: Mapped PNG
          content:
            image/png: {}
        "404":
          description: Palette or printer profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Invalid mapping request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    ApiErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                required: [detail, source]
                properties:
                  detail:
                    type: string
                  source:
                    type: object
                    required: [pointer]
                    properties:
                      pointer:
                        type: string
    TestSheetManifest:
      description: >
        Versioned sheet manifest consumed by the iOS companion application.
        [vendored gap-fill] The published schema only requires schema_version,
        sheet_id, and capture_profile; the server also renders the geometry
        fields below (ColorMatchingWeb.TestSheetJSON.manifest/1), which the
        companion app depends on. They are validated here until upstream
        formalizes them.
      type: object
      required:
        - schema_version
        - sheet_id
        - sheet_version
        - manifest_url
        - created_at
        - page
        - registration_markers
        - printer_profile
        - capture_profile
        - patches
        - pairs
      properties:
        schema_version:
          type: string
          enum: [lps-sheet-manifest/v1]
          description: Manifest compatibility version.
        sheet_id:
          type: string
        sheet_version:
          type: string
        manifest_url:
          type: string
        created_at:
          type: string
          format: date-time
        page:
          $ref: "#/components/schemas/ManifestPage"
        registration_markers:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationMarker"
        printer_profile:
          $ref: "#/components/schemas/SheetPrinterProfile"
        capture_profile:
          $ref: "#/components/schemas/CaptureProfile"
        patches:
          type: array
          items:
            $ref: "#/components/schemas/ManifestPatch"
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/ManifestPair"
    ManifestPage:
      description: "[vendored gap-fill] Page geometry of a printed test sheet."
      type: object
      required: [units, width, height]
      properties:
        units:
          type: string
        width:
          type: number
        height:
          type: number
    RegistrationMarker:
      description: "[vendored gap-fill] Fiducial marker used to register the sheet."
      type: object
      required: [role, shape, rect]
      properties:
        role:
          type: string
        shape:
          type: string
        rect:
          $ref: "#/components/schemas/Rect"
    Rect:
      description: "[vendored gap-fill] Axis-aligned rectangle in page units."
      type: object
      required: [x, y, width, height]
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
    ManifestPatch:
      description: "[vendored gap-fill] A single printed patch on the test sheet."
      type: object
      required:
        - id
        - role
        - pair_id
        - pair_side
        - source_color
        - safe_inset_mm
        - rect
      properties:
        id:
          type: string
        role:
          type: string
          description: Either `pair_color` or `reference`.
        pair_id:
          type: string
        pair_side:
          type: string
        reference_role:
          type: string
          nullable: true
        source_color:
          type: string
          nullable: true
        safe_inset_mm:
          type: number
        rect:
          $ref: "#/components/schemas/Rect"
    ManifestPair:
      description: "[vendored gap-fill] A pair of patches printed in one grid cell."
      type: object
      required:
        - id
        - first_patch_id
        - second_patch_id
        - source_colors
        - grid_row
        - grid_col
      properties:
        id:
          type: string
        first_patch_id:
          type: string
        second_patch_id:
          type: string
        source_colors:
          type: array
          items:
            type: string
        grid_row:
          type: integer
        grid_col:
          type: integer
    SheetPrinterProfile:
      description: >
        [vendored gap-fill] Printer profile embedded in manifest and ranked
        results responses, as rendered by ColorMatchingWeb.TestSheetJSON.
      type: object
      required: [printer_make_model, paper_type, ink_type]
      properties:
        printer_make_model:
          type: string
        paper_type:
          type: string
        ink_type:
          type: string
        icc_profile:
          type: string
          nullable: true
        print_settings:
          type: object
          additionalProperties: true
          nullable: true
        driver_name:
          type: string
          nullable: true
        driver_version:
          type: string
          nullable: true
        calibration_date:
          type: string
          format: date
          nullable: true
        calibration_version:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    CaptureProfile:
      description: >
        [vendored gap-fill] Capture expectations advertised by the manifest;
        upstream only requires scoring_algorithm_version.
      type: object
      required:
        - expected_illuminant
        - preferred_camera
        - scoring_algorithm_version
      properties:
        expected_illuminant:
          type: string
        preferred_camera:
          type: string
        scoring_algorithm_version:
          type: string
          enum: [lps-distance-v1]
          description: Distance-scoring compatibility version.
    RecentSheetsResponse:
      type: object
      required: [sheets]
      properties:
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/RecentSheet"
    RecentSheet:
      description: >
        [vendored promotion] Named component for the inline sheet summary
        item in RecentSheetsResponse.
      type: object
      required: [sheet_id, manifest_url, title]
      properties:
        sheet_id:
          type: string
        manifest_url:
          type: string
        title:
          type: string
          nullable: true
    CaptureMetadata:
      type: object
      required:
        - device_model
        - lens
        - image_width
        - image_height
        - app_version
        - timestamp
      properties:
        device_model:
          type: string
        lens:
          type: string
        exposure_duration_seconds:
          type: number
          minimum: 0
          exclusiveMinimum: true
        iso:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        focus_lens_position:
          type: number
          minimum: 0
        white_balance_gains:
          description: >
            [vendored gap-fill] The published schema leaves this freeform;
            the app always emits red/green/blue channel gains.
          type: object
          required: [red, green, blue]
          properties:
            red:
              type: number
            green:
              type: number
            blue:
              type: number
        image_width:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        image_height:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        app_version:
          type: string
        timestamp:
          type: string
          format: date-time
    CaptureQualityPayload:
      description: >
        [vendored promotion] Named component for the inline capture quality
        object in CaptureRequest.
      type: object
      properties:
        detected_marker_count:
          type: integer
          minimum: 0
        blur_score:
          type: number
          minimum: 0
        rejections:
          type: array
          items:
            type: string
    CaptureRequest:
      description: >
        [vendored normalization] The published schema accepts either the
        nested metadata/quality form or a legacy flat form via anyOf. The
        companion app always sends the nested form, so metadata is required
        here and the top-level anyOf is dropped. The flat fields remain
        optional for wire fidelity.
      type: object
      required: [metadata]
      properties:
        device_model:
          type: string
        lens:
          type: string
        exposure_duration:
          type: number
          minimum: 0
          exclusiveMinimum: true
        iso:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        focus_lens_position:
          type: number
          minimum: 0
        white_balance_gains:
          type: object
          additionalProperties: true
        image_width:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        image_height:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        app_version:
          type: string
        timestamp:
          type: string
          format: date-time
        detected_marker_count:
          type: integer
          minimum: 0
        blur_score:
          type: number
          minimum: 0
        rejection_reasons:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/CaptureMetadata"
        quality:
          $ref: "#/components/schemas/CaptureQualityPayload"
    CaptureCreatedResponse:
      type: object
      required: [capture_id]
      properties:
        capture_id:
          type: string
    RgbPayload:
      description: >
        [vendored normalization] The published schema accepts an RGB array,
        an r/g/b object, or a JSON-encoded string via anyOf. The app always
        emits the object form, which is pinned here.
      type: object
      required: [r, g, b]
      properties:
        r:
          type: number
        g:
          type: number
        b:
          type: number
    MeasurementUploadItem:
      description: >
        [vendored promotion] Named component for the inline measurement item
        in MeasurementUploadRequest. Note that the published schema carries
        no per-measurement stats block.
      type: object
      required:
        - patch_id
        - linear_rgb_median
        - normalized_linear_rgb_median
      properties:
        patch_id:
          type: string
        linear_rgb_median:
          $ref: "#/components/schemas/RgbPayload"
        normalized_linear_rgb_median:
          $ref: "#/components/schemas/RgbPayload"
    PairScoreRequest:
      description: >
        [vendored normalization] The published schema requires one of
        score/similarity/distance via anyOf; the app always emits similarity
        and distance together with algorithm_version.
      type: object
      required: [pair_id, algorithm_version]
      properties:
        pair_id:
          type: string
        algorithm_version:
          type: string
        score:
          type: number
        similarity:
          type: number
        distance:
          type: number
    MeasurementUploadRequest:
      type: object
      properties:
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/MeasurementUploadItem"
        pair_scores:
          type: array
          items:
            $ref: "#/components/schemas/PairScoreRequest"
    MeasurementUploadResponse:
      type: object
      required: [capture_id, measurement_count, pair_score_count]
      properties:
        capture_id:
          type: string
        measurement_count:
          type: integer
        pair_score_count:
          type: integer
    PairJudgment:
      description: >
        [vendored promotion] Named component for the inline judgment item in
        JudgmentUploadRequest.
      type: object
      required: [pair_id, judgment]
      properties:
        pair_id:
          type: string
        judgment:
          type: string
          description: One of `match`, `near_match`, or `no_match`.
    JudgmentUploadRequest:
      type: object
      required: [judgments]
      properties:
        judgments:
          type: array
          items:
            $ref: "#/components/schemas/PairJudgment"
    JudgmentUploadResponse:
      type: object
      required: [capture_id, judgment_count]
      properties:
        capture_id:
          type: string
        judgment_count:
          type: integer
    RankedResults:
      description: >
        [vendored gap-fill] The published schema only requires schema_version
        and sheet_id; the server also renders the aggregate fields below
        (ColorMatchingWeb.TestSheetJSON.ranked_results/2), which the
        companion app depends on.
      type: object
      required:
        - schema_version
        - sheet_id
        - printer_profile
        - capture_count
        - scoring_algorithm_versions
        - results
      properties:
        schema_version:
          type: string
          enum: [lps-ranked-results/v1]
        sheet_id:
          type: string
        printer_profile:
          $ref: "#/components/schemas/SheetPrinterProfile"
        capture_count:
          type: integer
        latest_capture_at:
          type: string
          format: date-time
          nullable: true
        earliest_capture_at:
          type: string
          format: date-time
          nullable: true
        scoring_algorithm_versions:
          type: array
          items:
            type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/RankedResultPair"
    RankedResultPair:
      description: "[vendored gap-fill] One ranked pair in ranked results."
      type: object
      required:
        - rank
        - pair_id
        - scoring_algorithm_version
        - row
        - col
        - source_colors
        - score
        - observation_count
        - capture_count
      properties:
        rank:
          type: integer
        pair_id:
          type: string
        scoring_algorithm_version:
          type: string
        row:
          type: integer
        col:
          type: integer
        source_colors:
          $ref: "#/components/schemas/RankedResultColors"
        score:
          $ref: "#/components/schemas/RankedResultScore"
        current_judgment:
          type: string
          nullable: true
        current_judgment_observed_at:
          type: string
          format: date-time
          nullable: true
        observation_count:
          type: integer
        latest_observation:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RankedResultObservation"
        capture_count:
          type: integer
        latest_capture_at:
          type: string
          format: date-time
          nullable: true
        earliest_capture_at:
          type: string
          format: date-time
          nullable: true
    RankedResultColors:
      description: "[vendored gap-fill] Source hex colors of a ranked pair."
      type: object
      required: [color_a_hex, color_b_hex]
      properties:
        color_a_hex:
          type: string
        color_b_hex:
          type: string
    RankedResultScore:
      description: "[vendored gap-fill] Aggregate distance score of a ranked pair."
      type: object
      required:
        - average
        - latest
        - minimum
        - maximum
        - capture_count
        - sample_count
        - algorithm_versions
      properties:
        average:
          type: number
        latest:
          type: number
        minimum:
          type: number
        maximum:
          type: number
        capture_count:
          type: integer
        sample_count:
          type: integer
        algorithm_versions:
          type: array
          items:
            type: string
    RankedResultObservation:
      description: "[vendored gap-fill] Latest human judgment of a ranked pair."
      type: object
      required: [judgment, observed_at]
      properties:
        judgment:
          type: string
        observed_at:
          type: string
          format: date-time
    PrinterProfile:
      type: object
      required: [id, printer_make_model, paper_type, ink_type]
      properties:
        id:
          type: integer
        printer_make_model:
          type: string
        paper_type:
          type: string
        ink_type:
          type: string
    Rgb:
      type: object
      required: [r, g, b]
      properties:
        r:
          type: integer
        g:
          type: integer
        b:
          type: integer
    PrinterProfilesResponse:
      type: object
      required: [printer_profiles]
      properties:
        printer_profiles:
          type: array
          items:
            $ref: "#/components/schemas/PrinterProfile"
    PalettesResponse:
      type: object
      required: [palettes]
      properties:
        palettes:
          type: array
          items:
            type: object
            required: [id, name, is_preset, color_count]
            properties:
              id:
                type: integer
              name:
                type: string
              is_preset:
                type: boolean
              color_count:
                type: integer
    ProfileColorsResponse:
      type: object
      required: [printer_profile, colors]
      properties:
        printer_profile:
          $ref: "#/components/schemas/PrinterProfile"
        colors:
          type: array
          items:
            type: object
            required: [name, hex, responses]
            properties:
              name:
                type: string
              hex:
                type: string
              rgb:
                $ref: "#/components/schemas/Rgb"
              responses:
                type: object
                additionalProperties: true
    ColorsResponse:
      type: object
      required: [printer_profile, colors]
      properties:
        printer_profile:
          $ref: "#/components/schemas/PrinterProfile"
        colors:
          type: array
          items:
            type: object
            required: [id, name, hex, palette_id, sort_order, responses]
            properties:
              id:
                type: integer
              name:
                type: string
              hex:
                type: string
              rgb:
                $ref: "#/components/schemas/Rgb"
              palette_id:
                type: integer
              palette_name:
                type: string
                nullable: true
              sort_order:
                type: integer
              responses:
                type: object
                additionalProperties: true
    MetamerPairsResponse:
      type: object
      required: [printer_profile, metamer_pairs]
      properties:
        printer_profile:
          $ref: "#/components/schemas/PrinterProfile"
        metamer_pairs:
          type: array
          items:
            type: object
            required: [pair_id, color_a_hex, color_b_hex, illuminant, classification]
            properties:
              pair_id:
                type: string
              color_a_hex:
                type: string
              color_b_hex:
                type: string
              illuminant:
                type: string
              classification:
                type: string
              notes:
                type: string
                nullable: true
              classified_at:
                type: string
                format: date-time
                nullable: true
    MultiImageMappingRequest:
      type: object
      required: [palette_id, printer_profile_id, weights, images]
      properties:
        palette_id:
          type: integer
          minimum: 1
        printer_profile_id:
          type: integer
          minimum: 1
        weights:
          type: object
          additionalProperties:
            type: number
        images:
          type: object
          additionalProperties:
            type: string
    IlluminantMeasurementRequest:
      type: object
      required: [color_id, printer_profile_id, light_source, brightness]
      properties:
        color_id:
          type: integer
        printer_profile_id:
          type: integer
        light_source:
          type: string
          enum: [white, red, green, blue, lps]
        brightness:
          type: number
          minimum: 0
          maximum: 1
    IlluminantMeasurementResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
    BulkIlluminantMeasurementRow:
      type: object
      required: [color_id, brightness]
      properties:
        color_id:
          type: integer
        brightness:
          type: number
          minimum: 0
          maximum: 1
        raw_value:
          type: number
        raw_unit:
          type: string
        notes:
          type: string
    BulkIlluminantMeasurementRequest:
      description: >
        Shared printer profile and light-source metadata apply to every
        measurement row.
      type: object
      required: [printer_profile_id, light_source, measurements]
      properties:
        printer_profile_id:
          type: integer
        light_source:
          type: string
          enum: [white, red, green, blue, lps]
        raw_value:
          type: number
        raw_unit:
          type: string
        notes:
          type: string
        measured_at:
          type: string
          format: date-time
        measurement_method:
          type: string
        measurement_device:
          type: string
        test_run_id:
          type: string
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/BulkIlluminantMeasurementRow"
    BulkIlluminantMeasurementResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
