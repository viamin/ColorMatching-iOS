name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Swift and iOS Tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run Swift package tests
        run: swift test

      - name: Select iPhone simulator
        id: simulator
        run: |
          SIMULATOR_ID="$(
            xcrun simctl list devices available iOS -j \
              | ruby -rjson -e '
                  devices = JSON.parse($stdin.read).fetch("devices").values.flatten
                  phone = devices.find { |device| device["name"].include?("iPhone") && device["isAvailable"] }
                  abort("No available iPhone simulator found") unless phone
                  puts phone.fetch("udid")
                '
          )"
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Run Xcode simulator tests
        run: |
          xcodebuild test \
            -project ColorMatchingLPS.xcodeproj \
            -scheme ColorMatchingLPS \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath .build/XcodeDerivedData
